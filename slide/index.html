<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Solver - Slides</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="deck">
    <header class="topbar">
      <h1>Crossword Solver - Présentation Oral</h1>
      <p id="counter" aria-live="polite"></p>
    </header>

    <section class="slide" id="slide" aria-live="polite"></section>

    <footer class="controls">
      <button id="prev" type="button">← Précédent</button>
      <button id="next" type="button">Suivant →</button>
    </footer>
  </main>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
